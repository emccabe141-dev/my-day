<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My day</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* The boys' screen: bright, bouncy and theirs. Each boy picks a theme; every tick earns a star and a little celebration.
   Casa Mallow itself stays calm and muted: this look is only for the tablets. */
body{--bg1:#1b1448;--bg2:#4a1f8f;--accent:#ffb020;--on-accent:#2a1600;--glow:rgba(255,176,32,.55)}
body.t-space{--bg1:#1b1448;--bg2:#4a1f8f;--accent:#ffb020;--on-accent:#2a1600;--glow:rgba(255,176,32,.55)}
body.t-bear{--bg1:#2a5bb8;--bg2:#173a7a;--accent:#ffa62b;--on-accent:#3a1d00;--glow:rgba(255,166,43,.55)}
body.t-ball{--bg1:#e8590c;--bg2:#7c2d12;--accent:#ffd43b;--on-accent:#3a2a00;--glow:rgba(255,212,59,.55)}
body.t-alien{--bg1:#14532d;--bg2:#4c1d95;--accent:#a3ff3c;--on-accent:#12300a;--glow:rgba(163,255,60,.5)}
body.t-ocean{--bg1:#0892b8;--bg2:#0a4f96;--accent:#ffd23f;--on-accent:#2a2000;--glow:rgba(255,210,63,.55)}
body.t-jungle{--bg1:#1f9d5a;--bg2:#0b6b4a;--accent:#ffd23f;--on-accent:#2a2000;--glow:rgba(255,210,63,.55)}
body.t-lava{--bg1:#f2622e;--bg2:#c81e3a;--accent:#ffe45e;--on-accent:#3a2500;--glow:rgba(255,228,94,.6)}
body.t-candy{--bg1:#f062ad;--bg2:#7a4cf0;--accent:#fff06a;--on-accent:#3a3000;--glow:rgba(255,240,106,.6)}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;color:#231942;font:20px/1.35 "Fredoka","Trebuchet MS",Verdana,Arial,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
.deco{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;font-size:44px;opacity:.28;animation:drift 9s ease-in-out infinite alternate}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px;color:#fff}
.mascot{font-size:54px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.hi{flex:1;min-width:0}
.hi b{display:block;font:700 34px/1.05 "Fredoka",sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hi small{font-size:19px;opacity:.92}
.round{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.22);font-size:28px;line-height:1;display:grid;place-items:center}
.themes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.2);border-radius:26px;padding:12px}
.themes button{border:4px solid transparent;border-radius:22px;min-width:92px;padding:10px 8px;font:600 17px/1.1 "Fredoka",sans-serif;color:#fff;display:grid;justify-items:center;gap:4px}
.themes button span{font-size:34px}
.themes button[aria-pressed="true"]{border-color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.seg button{font-size:clamp(14px,3.7vw,20px)!important;padding:12px 4px!important}
.special{display:flex;align-items:center;gap:14px;padding:14px 18px;border:5px solid #ffd43b;background:#fff9db}
.special .sp{font-size:46px;line-height:1;animation:bob 2s ease-in-out infinite}
.special small{display:block;font:700 17px/1.1 "Fredoka",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00}
.special b{display:block;font:700 25px/1.2 "Fredoka",sans-serif;overflow-wrap:anywhere}
.wsp{background:#fff9db;padding:8px 16px;display:grid;gap:2px;border-bottom:3px solid #ffd43b}
.wsp b{font:700 21px/1.2 "Fredoka",sans-serif}
.upd{display:block;text-align:center;text-decoration:none;background:#fff;color:#231942;border-radius:999px;padding:16px 20px;font:700 24px/1.1 "Fredoka",sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.2);animation:pulse 1.8s ease-in-out infinite}
.wk{padding:12px 18px 14px;display:grid;gap:8px}
.wkey{display:flex;align-items:center;gap:14px}
.wkey span{font-size:38px;line-height:1;flex:none}
.wkey b{font:700 27px/1.15 "Fredoka",sans-serif;overflow-wrap:anywhere}
.dayline{background:rgba(255,255,255,.2);border-radius:24px;padding:12px 16px;color:#fff;display:grid;gap:2px}
.dl-marks{position:relative;height:36px;margin:0 22px}
.dl-marks span{position:absolute;top:0;transform:translateX(-50%);font-size:28px;line-height:1}
.dl-marks span.past{opacity:.5;filter:grayscale(.7)}
.dl-track{position:relative;height:24px;margin:12px 22px 14px;border-radius:999px;background:linear-gradient(90deg,#ffd76a 0%,#8fd0ff 22%,#6db8ff 55%,#ffa25c 78%,#3a2f8f 92%,#1b1448 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.dl-track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:rgba(20,10,50,.45)}
.dl-track b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3));transition:left 1s}
.dl-ends{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:600 17px/1.2 "Fredoka",sans-serif}
.dl-ends .dl-now{font-size:19px;text-align:center}
.week{display:grid;gap:16px}
.wday{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.16);border:5px solid var(--c1)}
.wday.tod{border-color:#fff;outline:5px solid var(--c1)}
.wh{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.wh b{font:700 27px/1.1 "Fredoka",sans-serif}
.wh small{font:600 18px/1.1 "Fredoka",sans-serif;opacity:.95}
.wl{padding:10px 14px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 16px}
.wi{display:grid;grid-template-columns:32px 66px minmax(0,1fr);align-items:center;gap:8px;padding:4px 0;font:600 19px/1.2 "Fredoka",sans-serif}
.wi span{font-size:25px;line-height:1}
.wi small{color:#5b5378;font-size:17px}
.wi b{font-weight:600;overflow-wrap:anywhere}
.wfree{margin:6px 0;font:600 20px/1.2 "Fredoka",sans-serif;color:#5b5378}
.seg button{border:0;border-radius:999px;background:rgba(255,255,255,.2);color:#fff;padding:12px 8px;font:600 20px/1 "Fredoka",sans-serif;min-height:52px}
.seg button[aria-pressed="true"]{background:#fff;color:#231942;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.stars{background:rgba(255,255,255,.2);border-radius:24px;padding:12px 16px;color:#fff;display:grid;gap:8px}
.stars .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 21px/1.1 "Fredoka",sans-serif}
.stars .row b{font-size:26px}
.starline{display:flex;flex-wrap:wrap;gap:4px;font-size:28px;line-height:1}
.starline i{font-style:normal;opacity:.3;filter:grayscale(1)}
.starline i.on{opacity:1;filter:none}
.starline i.new{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.bar{height:16px;border-radius:999px;background:rgba(0,0,0,.22);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s}
.card{background:#fff;border-radius:34px;box-shadow:0 8px 0 rgba(0,0,0,.16)}
.now{padding:22px 20px 24px;display:grid;justify-items:center;gap:12px;text-align:center;border:6px solid var(--accent)}
.badge{background:var(--accent);color:var(--on-accent);font:700 18px/1 "Fredoka",sans-serif;letter-spacing:.08em;border-radius:999px;padding:8px 18px}
.bubble{display:grid;place-items:center;border-radius:50%;background:var(--v,#3b9dff);flex:none;line-height:1}
.now .bubble{width:150px;height:150px;font-size:86px;animation:bob 2s ease-in-out infinite;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.now .what{font:700 clamp(32px,8vw,50px)/1.05 "Fredoka",sans-serif;overflow-wrap:anywhere}
.now .left{font:600 22px/1.2 "Fredoka",sans-serif;color:#5b5378}
.timebar{width:100%;max-width:420px;height:18px;border-radius:999px;background:#ece8f6;overflow:hidden}
.timebar i{display:block;height:100%;border-radius:999px;background:var(--v,#3b9dff);transition:width 1s linear}
.donebtn{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 28px/1 "Fredoka",sans-serif;padding:20px 44px;min-height:72px;box-shadow:0 7px 0 rgba(0,0,0,.2);animation:pulse 1.8s ease-in-out infinite}
.donebtn:active,.tick:active{transform:translateY(4px) scale(.97)}
.free .bubble{background:#ffe9a8}
.next{display:flex;align-items:center;gap:16px;padding:14px 18px}
.next .bubble{width:72px;height:72px;font-size:40px}
.next b{font:700 26px/1.15 "Fredoka",sans-serif;display:block;overflow-wrap:anywhere}
.next small{font:600 18px/1.2 "Fredoka",sans-serif;color:#5b5378}
.extra{padding:16px;display:grid;gap:14px}
.jar{display:flex;align-items:center;gap:18px}
.jarsvg{flex:none}
.jar .jt{display:grid;gap:4px;min-width:0}
.jar .jt b{font:700 26px/1.1 "Fredoka",sans-serif}
.jar .jt small{font:600 21px/1.2 "Fredoka",sans-serif;color:#231942}
.jar .jt small.dim{color:#5b5378;font-size:18px}
.mallows{display:flex;gap:6px;flex-wrap:wrap}
.mallows i{width:34px;height:28px;border-radius:11px;border:3px dashed #c9c2dc;background:transparent}
.mallows i.in{border:3px solid #231942;background:#fff3e6;box-shadow:inset 0 -5px 0 #ffd9e6}
.earn{margin:0;font:600 20px/1.2 "Fredoka",sans-serif;color:#5b5378}
.xbtns{display:flex;gap:10px;flex-wrap:wrap}
.xb{flex:1 1 180px;border:4px solid #d9d3ea;border-radius:22px;background:#f6f3fc;font:700 21px/1.15 "Fredoka",sans-serif;padding:12px 14px;min-height:68px;display:flex;align-items:center;gap:10px;text-align:left;color:#231942}
.xb span{font-size:32px;line-height:1}
.xb.on{background:#eafbe7;border-color:#7fd08a;color:#2f7d32}
.xb:disabled{opacity:1}
.list{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;align-items:center;gap:14px;padding:12px 10px 12px 14px;border-radius:28px;background:#fff;border:5px solid transparent;min-height:100px;box-shadow:0 6px 0 rgba(0,0,0,.14);transition:transform .25s}
.tile .bubble{width:76px;height:76px;font-size:42px}
.tile .t{font:700 25px/1.12 "Fredoka",sans-serif;overflow-wrap:anywhere;display:block}
.tile .when{font:600 18px/1.2 "Fredoka",sans-serif;color:#5b5378;display:block;margin-top:3px}
.tile.cur{border-color:var(--accent);box-shadow:0 0 0 6px var(--glow),0 6px 0 rgba(0,0,0,.14);transform:scale(1.02)}
.tile.past{background:rgba(255,255,255,.88)}
.tile.done{background:#eafbe7}
.tile.done .t{color:#2f7d32}
.tick{width:76px;height:76px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%}
.tick i{width:60px;height:60px;border-radius:50%;border:5px dashed #c9c2dc;display:grid;place-items:center;font-style:normal;font-size:38px;line-height:1}
.tick.on i{border:0;background:#2fb344;color:#fff;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.tick.fresh i{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.allone{padding:24px 18px;text-align:center;display:grid;gap:8px;justify-items:center;border:6px solid var(--accent)}
.allone span{font-size:84px;line-height:1;animation:bob 1.6s ease-in-out infinite}
.allone b{font:700 34px/1.1 "Fredoka",sans-serif}
.msg{color:#fff;text-align:center;padding:30px 10px;font:600 24px/1.3 "Fredoka",sans-serif}
.note{color:#fff;font-size:17px;text-align:center;background:rgba(0,0,0,.2);border-radius:16px;padding:8px 12px;margin:0}
.pick{display:grid;gap:18px;padding-top:24px}
.pick button{border:0;border-radius:36px;background:#fff;min-height:170px;font:700 44px/1 "Fredoka",sans-serif;box-shadow:0 8px 0 rgba(0,0,0,.16);display:grid;place-items:center;gap:6px}
.pick button span{font-size:64px}
.cheer{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;background:#fff;color:#231942;font:700 40px/1 "Fredoka",sans-serif;padding:18px 30px;border-radius:999px;box-shadow:0 8px 0 rgba(0,0,0,.2);pointer-events:none;white-space:nowrap;animation:cheer 1.5s ease-out forwards}
.bits{position:fixed;left:0;top:0;width:0;height:0;z-index:29;pointer-events:none}
.bits span{position:absolute;font-size:30px;line-height:1;animation:fly 1.25s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes drift{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(18px,-26px) rotate(10deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.35) rotate(12deg)}100%{transform:scale(1) rotate(0)}}
@keyframes cheer{0%{transform:translateX(-50%) scale(.4);opacity:0}18%{transform:translateX(-50%) scale(1.12);opacity:1}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{transform:translateX(-50%) translateY(-30px) scale(1);opacity:0}}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1);opacity:0}}
@media (max-width:480px){.tile{grid-template-columns:60px minmax(0,1fr) 64px;gap:10px}.tile .bubble{width:60px;height:60px;font-size:34px}.tile .t{font-size:21px}.tick{width:64px;height:64px}.tick i{width:52px;height:52px;font-size:32px}.hi b{font-size:28px}.mascot{font-size:44px}.now .bubble{width:124px;height:124px;font-size:70px}}
.fx{position:fixed;left:0;top:0;right:0;bottom:0;display:grid;place-items:center;z-index:28;pointer-events:none;animation:fxin 2.1s ease forwards}
.fx-blob{position:relative;width:min(70vw,330px);height:min(70vw,330px);border-radius:50%;background:#fff;box-shadow:0 12px 0 rgba(0,0,0,.2),0 0 0 10px rgba(255,255,255,.35);display:grid;place-items:center;overflow:hidden}
.fx-blob svg{width:78%;height:78%;overflow:visible}
.fx-emoji{font-size:min(38vw,180px);line-height:1;display:block}
.fx-shake{transform-origin:100px 190px;animation:fxshake .16s linear infinite}
.fx-lines{animation:fxblink .32s steps(2) infinite}
.fx-look{animation:fxlook .9s ease-in-out infinite}
.fx-grin{transform-origin:110px 90px;animation:fxgrin .5s ease-in-out infinite alternate}
.fx-spark path{transform-box:fill-box;transform-origin:center;animation:fxtwinkle .7s ease-in-out infinite alternate}
.fx-spark path:nth-child(2){animation-delay:.2s}.fx-spark path:nth-child(3){animation-delay:.35s}.fx-spark path:nth-child(4){animation-delay:.5s}
.fx-stomp{transform-origin:125px 170px;animation:fxstomp .5s cubic-bezier(.3,0,.6,1) infinite}
.fx-chomp{animation:fxchomp .32s ease-in-out infinite alternate}
.fx-spin{animation:fxspin 1s cubic-bezier(.3,.1,.3,1) 2}
.fx-bubbles,.fx-zzz{animation:fxsway 1s ease-in-out infinite alternate}
.fx-drive{animation:fxdrive 1.9s cubic-bezier(.4,0,.5,1) forwards}
.fx-pop{animation:fxpop .6s cubic-bezier(.3,1.6,.5,1) 3 alternate}
.fx-b,.fx-z{position:absolute;font-style:normal;font-size:44px;line-height:1;opacity:0;animation:fxrise 1.4s ease-out infinite}
.fx-b.b1{left:18%;bottom:14%}.fx-b.b2{left:66%;bottom:20%;animation-delay:.35s}.fx-b.b3{left:44%;bottom:8%;animation-delay:.7s}
.fx-z.z1{left:62%;top:34%}.fx-z.z2{left:72%;top:22%;animation-delay:.6s}
@keyframes fxin{0%{opacity:0;transform:scale(.3)}10%{opacity:1;transform:scale(1.08)}16%{transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
@keyframes fxshake{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes fxblink{0%{opacity:1}100%{opacity:.15}}
@keyframes fxlook{0%,100%{transform:translate(-4px,0)}50%{transform:translate(5px,-2px)}}
@keyframes fxgrin{from{transform:scale(.9) rotate(-3deg)}to{transform:scale(1.08) rotate(3deg)}}
@keyframes fxtwinkle{from{transform:scale(.3) rotate(0);opacity:.3}to{transform:scale(1.3) rotate(40deg);opacity:1}}
@keyframes fxstomp{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-34px) rotate(-8deg)}80%{transform:translateY(0) scale(1.08,.88)}}
@keyframes fxchomp{from{transform:scale(1,1)}to{transform:scale(1.12,.84) translateY(8px)}}
@keyframes fxspin{from{transform:rotate(0) scale(.7)}to{transform:rotate(360deg) scale(1)}}
@keyframes fxsway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes fxdrive{0%{transform:translateX(-140%) scaleX(-1)}45%,60%{transform:translateX(0) scaleX(-1) rotate(4deg)}100%{transform:translateX(150%) scaleX(-1)}}
@keyframes fxpop{from{transform:scale(.7) rotate(-10deg)}to{transform:scale(1.15) rotate(10deg)}}
@keyframes fxrise{0%{opacity:0;transform:translateY(20px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-110px) scale(1.2)}}
.picsvg{width:1.15em;height:1.15em;display:block;overflow:visible}
.fx-bagflat{transform-origin:100px 180px;animation:fxbagflat 1.9s ease-in forwards}
.fx-bagball{transform-origin:100px 110px;animation:fxbagball 1.9s ease-out forwards}
@keyframes fxbagflat{0%{transform:scale(1,1) rotate(0);opacity:1}15%{transform:scale(1.06,.9) rotate(-4deg)}28%{transform:scale(.86,.8) rotate(6deg)}40%{transform:scale(.9,.6) rotate(-8deg)}50%{transform:scale(.7,.5) rotate(8deg);opacity:1}58%,100%{transform:scale(.6,.45) rotate(0);opacity:0}}
@keyframes fxbagball{0%,48%{transform:scale(1.3) rotate(-20deg);opacity:0}58%{transform:scale(1.15) rotate(8deg);opacity:1}66%{transform:scale(.8) rotate(-10deg)}74%{transform:scale(.95) rotate(6deg)}82%{transform:scale(.82) rotate(-4deg)}100%{transform:scale(.9) rotate(0);opacity:1}}
.lovebtn{position:fixed;right:14px;bottom:14px;z-index:20;width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:#ff4d6d;font-size:36px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:lovebeat 1.4s ease-in-out infinite}
.love{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;border:0;cursor:pointer;padding:16px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a2f8f,#140b3d 70%);color:#fff;overflow:hidden;animation:lovein .5s cubic-bezier(.3,1.4,.5,1)}
.love-sky i{position:absolute;font-style:normal;font-size:20px;color:#ffe9a8;animation:fxtwinkle 1.1s ease-in-out infinite alternate}
.love-in{position:relative;display:grid;justify-items:center;gap:18px;max-width:100%}
.love-space{position:relative;display:block;width:340px;height:340px;transform:rotate(-14deg)}
@media (max-width:420px){.love-space{transform:rotate(-14deg) scale(.8);margin:-30px}}
@media (min-width:700px) and (min-height:700px){.love-space{transform:rotate(-14deg) scale(1.35);margin:60px}}
.love-earth{position:absolute;left:19%;top:19%;width:62%;height:62%;z-index:2;display:block;transform:rotate(14deg);animation:earthbob 3s ease-in-out infinite}
.love-earth svg{width:100%;height:100%;display:block}
.orb{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;animation:orbz 2.6s steps(1) infinite}
.orbx{position:absolute;left:0;top:0;animation:orbx 1.3s cubic-bezier(.37,0,.63,1) infinite alternate}
.orby{position:absolute;left:0;top:0;animation:orby 1.3s cubic-bezier(.37,0,.63,1) -.65s infinite alternate}
.love-heart{position:absolute;left:-40px;top:-36px;width:80px;height:72px;display:grid;place-items:center;font-size:62px;line-height:1;animation:orbs 2.6s ease-in-out infinite}
.orb.h2{animation-delay:-1.3s}.orb.h2 .orbx{animation-delay:-1.3s}.orb.h2 .orby{animation-delay:-1.95s}.orb.h2 .love-heart{font-size:38px;animation-delay:-1.3s}

  (e.teeth||[]).forEach(function(s){var am=s.s==='am',own=d.done.indexOf(s.b)>=0,steps=items.filter(function(x){return /teeth/i.test(x.title)&&((x.s<720)===am)}),done=own||steps.some(isDone);

FX_SVG.crumple='<svg viewBox="0 0 200 200"><g class="fx-bagflat"><path d="M56 44l11-12 11 12 11-12 11 12 11-12 11 12 11-12 11 12 8 136H48z" fill="#c98f4e" stroke="#231942" stroke-width="7" stroke-linejoin="round"/><path d="M78 44l-6 136M122 44l6 136" stroke="#7a4f1d" stroke-width="4"/><circle cx="88" cy="98" r="7" fill="#231942"/><circle cx="114" cy="98" r="7" fill="#231942"/><ellipse cx="101" cy="124" rx="9" ry="11" fill="#231942"/></g><g class="fx-bagball">'+BAG_BALL+'</g><g class="fx-lines" stroke="#ffb020" stroke-width="7" stroke-linecap="round"><path d="M30 70 16 58M170 70l14-12M24 130H8M176 130h16"/></g></svg>';
function fxKind(t){t=String(t||'').toLowerCase();return /snack (pack|bag)|paper bag/.test(t)?'crumple':/wake|get up|alarm/.test(t)?'clock':/teeth|tooth/.test(t)?'mouth':/shoe|sock/.test(t)?'shoe':/breakfast|lunch|dinner|supper|snack|\btea\b|eat/.test(t)?'chomp':/dress|clothes|uniform|pyjama|pjs/.test(t)?'spin':/bath|shower|wash/.test(t)?'bubbles':/\bbed|sleep/.test(t)?'zzz':/car\b|school|leave|bus|pick|drop|take you/.test(t)?'drive':'pop'}
function fx(id){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;var d=state.day;if(!d||/_swap/.test(id))return;
  var it=null,ex=d.extra||{};shape(d).forEach(function(x){if(x.b===id)it={title:x.title,pic:x.pic}});
  if(!it&&/^teeth_/.test(id))it={title:'teeth',pic:'🪥'};
  if(!it)(ex.hab||[]).forEach(function(hb){if(hb.b===id)it={title:hb.l,pic:HAB_PIC[hb.id]||hb.icon||'⭐'}});
  if(!it)return;var k=fxKind(it.title),inner=FX_SVG[k]||'<span class="fx-emoji fx-'+k+'">'+it.pic+'</span>'+(k==='bubbles'?'<i class="fx-b b1">🫧</i><i class="fx-b b2">🫧</i><i class="fx-b b3">🫧</i>':k==='zzz'?'<i class="fx-z z1">💤</i><i class="fx-z z2">💤</i>':'');
  var old=document.querySelector('.fx');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var el=document.createElement('div');el.className='fx';el.setAttribute('aria-hidden','true');el.innerHTML='<div class="fx-blob fxk-'+k+'">'+inner+'</div>';document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},2100)}
/* the silly button: each press plays the next daft noise (made here, no sound files) with a daft picture to match */
function sctx(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=actx||new AC();if(actx.state==='suspended'){try{actx.resume()}catch(e){}}return actx}
function snoise(c,dur){var b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;var s=c.createBufferSource();s.buffer=b;return s}
function senv(g,t,a,peak,hold,rel){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t+a+hold+rel)}
var SILLY=[
  {k:'fart',e:'😳',w:'PARP!',x:'<i class="sil-puff p1">💨</i><i class="sil-puff p2">💨</i><i class="sil-puff p3">💨</i>',s:function(c,t){
    var o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(52,t+.75);
    l.frequency.setValueAtTime(34,t);l.frequency.linearRampToValueAtTime(19,t+.8);lg.gain.value=34;l.connect(lg);lg.connect(o.frequency);f.type='lowpass';f.frequency.value=480;f.Q.value=3;
    senv(g,t,.03,.55,.5,.3);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);l.start(t);o.stop(t+.9);l.stop(t+.9)}},
  {k:'burp',e:'😮',w:'BUUURP!',x:'<i class="sil-bub b1">🫧</i><i class="sil-bub b2">🫧</i>',s:function(c,t){
    var o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(95,t);o.frequency.linearRampToValueAtTime(70,t+.25);o.frequency.linearRampToValueAtTime(110,t+.6);
    l.frequency.value=42;lg.gain.value=22;l.connect(lg);lg.connect(o.frequency);f.type='bandpass';f.Q.value=4;f.frequency.setValueAtTime(350,t);f.frequency.linearRampToValueAtTime(950,t+.3);f.frequency.linearRampToValueAtTime(420,t+.65);
    senv(g,t,.04,.7,.42,.2);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);l.start(t);o.stop(t+.75);l.stop(t+.75)}},
  {k:'sneeze',e:'🤧',w:'AH… AH… CHOO!',x:'<i class="sil-drop d1">💦</i><i class="sil-drop d2">💦</i>',s:function(c,t){
    [0,.34].forEach(function(dl){var n=snoise(c,.25),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.setValueAtTime(700,t+dl);f.frequency.linearRampToValueAtTime(1300,t+dl+.2);f.Q.value=2;senv(g,t+dl,.08,.22,.06,.1);n.connect(f);f.connect(g);g.connect(c.destination);n.start(t+dl);n.stop(t+dl+.26)});
    var n2=snoise(c,.6),f2=c.createBiquadFilter(),g2=c.createGain();f2.type='highpass';f2.frequency.setValueAtTime(3200,t+.72);f2.frequency.exponentialRampToValueAtTime(700,t+1.2);senv(g2,t+.72,.015,.8,.08,.4);n2.connect(f2);f2.connect(g2);g2.connect(c.destination);n2.start(t+.72);n2.stop(t+1.3);
    var o=c.createOscillator(),g3=c.createGain();o.type='triangle';o.frequency.setValueAtTime(900,t+.72);o.frequency.exponentialRampToValueAtTime(260,t+1.05);senv(g3,t+.72,.02,.3,.05,.3);o.connect(g3);g3.connect(c.destination);o.start(t+.72);o.stop(t+1.15)}},
  {k:'boing',e:'🐸',w:'BOING!',x:'',s:function(c,t){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);
    [[.12,520],[.26,200],[.38,440],[.5,220],[.62,360],[.8,180]].forEach(function(p){o.frequency.exponentialRampToValueAtTime(p[1],t+p[0])});senv(g,t,.01,.5,.5,.35);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.9)}},
  {k:'quack',e:'🦆',w:'QUACK QUACK!',x:'',s:function(c,t){[0,.3].forEach(function(dl){var o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(640,t+dl);o.frequency.exponentialRampToValueAtTime(380,t+dl+.18);
    f.type='bandpass';f.frequency.value=1300;f.Q.value=6;senv(g,t+dl,.01,.7,.1,.09);o.connect(f);f.connect(g);g.connect(c.destination);o.start(t+dl);o.stop(t+dl+.22)})}},
  {k:'whee',e:'🎈',w:'WHEEEEE!',x:'',s:function(c,t){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(1700,t+.7);o.frequency.exponentialRampToValueAtTime(240,t+1.15);senv(g,t,.03,.35,.8,.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1.2)}}];
function silly(){var i=(+store.get('silly')||0)%SILLY.length,it=SILLY[i];store.set('silly',i+1);
  try{var c=sctx();if(c)it.s(c,c.currentTime+.03)}catch(e){}
  var old=document.querySelector('.fx');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var el=document.createElement('div');el.className='fx sillyfx';el.setAttribute('role','status');el.innerHTML='<div class="sil-in"><div class="fx-blob"><span class="fx-emoji sil-'+it.k+'">'+it.e+'</span>'+it.x+'</div><b class="sil-word">'+it.w+'</b></div>';
  document.body.appendChild(el);setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},2100)}
/* the heart button: a message from Mum, with a heart flying round the world */
var EARTH='<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#2d8cff" stroke="#0b2a6b" stroke-width="6"/><path d="M52 58q18-22 44-14 10 8-2 18-16 4-14 20-8 16-24 8-14-14-4-32zM118 96q22-10 40 6 8 22-8 40-20 12-30-8-10-22-2-38zM70 138q14-6 22 6 2 16-12 20-14-4-10-26z" fill="#37c871" stroke="#0b2a6b" stroke-width="4" stroke-linejoin="round"/><path d="M30 92q14-8 26 0M140 52q12-8 24 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"/><circle cx="80" cy="96" r="9" fill="#fff"/><circle cx="118" cy="92" r="9" fill="#fff"/><circle cx="82" cy="98" r="4.5" fill="#0b2a6b"/><circle cx="120" cy="94" r="4.5" fill="#0b2a6b"/><path d="M84 118q16 14 32-2" fill="none" stroke="#0b2a6b" stroke-width="5" stroke-linecap="round"/><circle cx="68" cy="112" r="7" fill="#ff8fb3" opacity=".8"/><circle cx="132" cy="108" r="7" fill="#ff8fb3" opacity=".8"/></svg>';
/* The photo in the message is chosen on the tablet itself and kept only on that tablet (never uploaded anywhere). */
function lovePhoto(){try{return localStorage.getItem('lovephoto')||''}catch(e){return ''}}
function love(){var old=document.querySelector('.love');if(old&&old.parentNode){old.parentNode.removeChild(old);return}
  var ph=lovePhoto(),el=document.createElement('div');el.className='love'+(ph?' withphoto':'');el.setAttribute('role','dialog');el.setAttribute('aria-label','Mummy loves you more than the whole world. Tap to close.');
  var stars='';for(var i=0;i<16;i++)stars+='<i style="left:'+((i*61)%97)+'%;top:'+((i*37)%93)+'%;animation-delay:-'+(i*.23).toFixed(2)+'s">✦</i>';
  el.innerHTML='<span class="love-sky">'+stars+'</span><span class="love-in"><span class="love-space"><span class="love-earth">'+EARTH+'</span><span class="orb"><span class="orbx"><span class="orby"><span class="love-heart">❤️</span></span></span></span><span class="orb h2"><span class="orbx"><span class="orby"><span class="love-heart">💖</span></span></span></span></span>'
    +(ph?'<img class="love-photo" alt="Our family" src="'+ph+'">':'')+'<span class="love-txt"><b>Mummy loves you</b><em>more than the whole world</em></span></span>'
    +'<label class="love-cam'+(ph?' has':'')+'"><input type="file" accept="image/*" hidden>📷'+(ph?'':' Add a photo')+'</label>';
  function shut(){if(el.parentNode)el.parentNode.removeChild(el)}
  el.addEventListener('click',function(e){if(e.target.closest('.love-cam')){clearTimeout(el._t);return}shut()});
  el.querySelector('input').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;var img=new Image(),url=URL.createObjectURL(f);
    img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{localStorage.setItem('lovephoto',c.toDataURL('image/jpeg',.82))}catch(e){}URL.revokeObjectURL(url);shut();love()};
    img.onerror=function(){URL.revokeObjectURL(url)};img.src=url});
  document.body.appendChild(el);chime(true);el._t=setTimeout(shut,ph?12000:9000)}
function loveBtn(){if(document.querySelector('.lovebtn'))return;var sb=document.createElement('button');sb.className='sillybtn';sb.setAttribute('data-silly','');sb.setAttribute('aria-label','Make a silly noise');sb.textContent='🤪';document.body.appendChild(sb);var b=document.createElement('button');b.className='lovebtn';b.setAttribute('data-love','');b.setAttribute('aria-label','A message from Mummy');b.textContent='💗';document.body.appendChild(b)}
/* every tick says "Good job" with his own name, on screen. No spoken voice for now: Mum will record her own to add later. */
function goodJob(){var nm=(state.day&&state.day.name)||'';cheer('Good job'+(nm?', '+nm:'')+'!')}
var actx=null;
function chime(big){if(!store.get('snd'))return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;actx=actx||new AC();var notes=big?[523,659,784,1047]:[659,988],t=actx.currentTime;
    notes.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.16,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.11+.32);o.connect(g);g.connect(actx.destination);o.start(t+i*.11);o.stop(t+i*.11+.35)})}catch(e){}}

function load(){if(!KID){pick();return}
  if(state.cd){google.script.run.withSuccessHandler(function(c){state.cds=c;state.note='';if(state.cd)render()})
    .withFailureHandler(function(){state.note=state.cds?'No internet just now. Showing what loaded last.':'Your countdowns could not load just now. Try again in a moment.';if(state.cd)render()}).getCounts(KID);return}
  if(state.week){google.script.run.withSuccessHandler(function(w){state.wk=w;state.note='';if(state.week)render()})
    .withFailureHandler(function(){state.note=state.wk?'No internet just now. Showing what loaded last.':'Your week could not load just now. Try again in a moment.';if(state.week)render()}).getWeek(KID);return}
  google.script.run.withSuccessHandler(function(d){
    Object.keys(state.pending).forEach(function(id){var i=d.done.indexOf(id);if(state.pending[id]&&i<0)d.done.push(id);if(!state.pending[id]&&i>=0)d.done.splice(i,1)});
    state.day=d;state.note='';if(d.isToday)store.set('day-'+KID,d);render()})
  .withFailureHandler(function(err){var m=String(err&&err.message||'');
    if(!state.day){var c=store.get('day-'+KID);if(c&&c.v===2&&!state.tomorrow){var t=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(new Date());if(c.date===t)state.day=c}}
    state.note=/NOT_SET_UP/.test(m)?'A grown-up needs to open Casa Mallow once to send the timetable here.':/UPDATING/.test(m)?'The timetable is being updated. Back in a moment.':'No internet just now. Showing what loaded last.';render()})
  .getDay(KID,state.tomorrow)}

function tick(id,on,x,y){var d=state.day;if(!d||!d.isToday)return;var i=d.done.indexOf(id);if(on&&i<0)d.done.push(id);if(!on&&i>=0)d.done.splice(i,1);state.pending[id]=on;
  if(on){state.fresh=id;party(x,y,22);goodJob();chime(false);fx(id)}
  render();
  google.script.run.withSuccessHandler(function(){delete state.pending[id];store.set('day-'+KID,state.day)})
  .withFailureHandler(function(){delete state.pending[id];var j=d.done.indexOf(id);if(on&&j>=0)d.done.splice(j,1);if(!on&&j<0)d.done.push(id);state.note='That tick did not save. Try again.';render()})
  .setTick(KID,id,on)}

document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.silly!==undefined){silly();return}
  if(d.love!==undefined||d.loveclose!==undefined){love();return}
  if(d.pick){loveBtn();KID=d.pick;store.set('kid',KID);state.day=null;applyTheme();render();load();return}
  if(d.themes!==undefined){state.themes=!state.themes;render();return}
  if(d.theme){store.set('theme-'+KID,d.theme);state.themes=false;applyTheme();render();party(window.innerWidth/2,window.innerHeight/3,18);return}
  if(d.snd!==undefined){store.set('snd',!store.get('snd'));render();chime(false);return}
  if(d.view){var wasTom=state.tomorrow;state.week=d.view==='week';state.jar=d.view==='jar';state.nn=d.view==='nn';state.cd=d.view==='cd';state.tomorrow=d.view==='tom';if(!state.week&&!state.cd&&(state.tomorrow!==wasTom||!state.day))state.day=null;state.note='';render();load();return}
  if(d.tick){var r=b.getBoundingClientRect();tick(d.tick,d.on==='1',r.left+r.width/2,r.top+r.height/2);return}});
setInterval(function(){if(state.day)render()},30000);
setInterval(function(){if(!document.hidden)load()},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
if(KID){loveBtn();applyTheme();var c=store.get('day-'+KID);if(c){var t=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London'}).format(new Date());if(c.date===t&&c.v===2){state.day=c;render()}}}
load();
})();
